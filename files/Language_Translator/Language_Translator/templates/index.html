<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Language Translator</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- Top Navigation -->
<header class="navbar">
  <div class="navbar-brand">
    <div class="logo-icon"><i class="fa-solid fa-language"></i></div>
    <span>LinguaBridge</span>
  </div>
  <button id="darkModeToggle" class="icon-btn" title="Toggle dark mode">
    <i class="fa-solid fa-moon"></i>
  </button>
</header>

<main class="page">

  <section class="hero">
    <h1>AI Language Translation Tool</h1>
    <p>Translate text instantly across 14+ languages, powered by LibreTranslate.</p>
  </section>

  <section class="translator-card">

    <!-- Language selectors -->
    <div class="lang-bar">
      <select id="sourceLang" class="lang-select"></select>

      <button id="swapBtn" class="icon-btn swap-btn" title="Swap languages">
        <i class="fa-solid fa-arrow-right-arrow-left"></i>
      </button>

      <select id="targetLang" class="lang-select"></select>
    </div>

    <!-- Text panels -->
    <div class="panels">

      <div class="panel">
        <textarea id="inputText" maxlength="2000" placeholder="Enter text to translate..."></textarea>
        <div class="panel-footer">
          <span id="charCount" class="char-count">0 / 2000</span>
          <div class="panel-actions">
            <button id="clearBtn" class="text-btn" title="Clear text">
              <i class="fa-solid fa-trash"></i> Clear
            </button>
            <button id="speakInputBtn" class="text-btn" title="Listen to input">
              <i class="fa-solid fa-volume-high"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="panel output-panel">
        <div id="outputText" class="output-text" aria-live="polite">
          <span class="placeholder">Translation will appear here...</span>
        </div>
        <div id="loadingSpinner" class="spinner hidden">
          <div class="dot-flashing"></div>
        </div>
        <div class="panel-footer">
          <span id="toastMsg" class="toast-msg"></span>
          <div class="panel-actions">
            <button id="copyBtn" class="text-btn" title="Copy translation">
              <i class="fa-solid fa-copy"></i> Copy
            </button>
            <button id="speakOutputBtn" class="text-btn" title="Listen to translation">
              <i class="fa-solid fa-volume-high"></i>
            </button>
            <button id="downloadBtn" class="text-btn" title="Download as TXT">
              <i class="fa-solid fa-download"></i>
            </button>
          </div>
        </div>
      </div>

    </div>

    <button id="translateBtn" class="translate-btn">
      <span class="btn-text"><i class="fa-solid fa-language"></i> Translate</span>
    </button>

    <p id="errorMsg" class="error-msg hidden"></p>

  </section>

  <!-- Recent history -->
  <section class="history-card">
    <div class="history-header">
      <h2><i class="fa-regular fa-clock"></i> Recent Translations</h2>
      <button id="clearHistoryBtn" class="text-btn">Clear</button>
    </div>
    <ul id="historyList" class="history-list">
      <li class="history-empty">No translations yet.</li>
    </ul>
  </section>

</main>

<footer class="footer">
  <p>Built with Flask &amp; LibreTranslate &middot; Internship Project</p>
</footer>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
